name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Do not cancel a deployment already in progress when new card batches are committed.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:ambiguous
      - run: npm run validate:maps
      - run: npm test
      - run: npm run build
      - name: Prepare browser
        shell: bash
        run: |
          # Hosted runners already include Chrome and its runtime libraries.
          # Reuse it instead of requiring Ubuntu mirrors for extra fonts.
          if command -v google-chrome > /dev/null 2>&1; then
            browser_path="$(command -v google-chrome)"
            "$browser_path" --version
            printf 'CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          elif command -v chromium > /dev/null 2>&1; then
            browser_path="$(command -v chromium)"
            "$browser_path" --version
            printf 'CHROMIUM_PATH=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Verify static files exist before publication
        run: test -s dist/index.html && test -s dist/sw.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: playwright-report/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
